name: Check built CSS

# Fails if assets/css/styles.css is out of date with index.html / src/styles.css.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify assets/css/styles.css is committed and current
        run: |
          if ! git diff --exit-code -- assets/css/styles.css; then
            echo "::error::assets/css/styles.css is out of date. Run 'npm run build' and commit the result."
            exit 1
          fi
